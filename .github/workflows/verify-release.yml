name: Verify downloaded release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag
        required: true
        default: v1.4.0
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact published installer and portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./tests/Test-DownloadedRelease.ps1 -ReleaseTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v7
        with:
          name: downloaded-release-evidence
          path: downloaded-release-evidence.json
          if-no-files-found: error
