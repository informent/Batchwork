name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run regression tests
        run: dotnet run --project tests/RenameEngineTests.csproj -c Release --nologo
      - name: Build
        run: dotnet build Batchwork.csproj -c Release --nologo
      - name: Publish self-contained executable
        run: dotnet publish Batchwork.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o release-output --nologo
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release-output/Batchwork.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Published executable is missing.' }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw "Published application exited with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'Batchwork-win-x64.zip'
          Compress-Archive -Path 'release-output/Batchwork.exe' -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Batchwork-win-x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" Batchwork-win-x64.zip SHA256SUMS.txt --title "Batchwork $env:GITHUB_REF_NAME" --generate-notes
